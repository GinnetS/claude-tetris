<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS <span class="smiley" role="img" aria-label="cara feliz">😊</span></h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section">
          <span class="label">THEME</span>
          <button id="theme-toggle" class="theme-switch" role="switch" aria-checked="false">
            <span class="track"><span class="thumb"></span></span>
            <span id="theme-text">Modo claro</span>
          </button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <p id="overlay-stats"></p>

        <form id="name-form" class="name-form hidden">
          <label for="player-name" id="name-label">¡Nuevo récord!</label>
          <div class="name-row">
            <input id="player-name" type="text" maxlength="12" autocomplete="off" placeholder="Tu nombre" />
            <button type="submit">Guardar</button>
          </div>
        </form>

        <section id="records" class="records">
          <span class="label">RÉCORDS</span>
          <table>
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <p id="records-stats" class="records-stats"></p>
          <button id="reset-records" class="link-btn" type="button">Borrar récords</button>
        </section>

        <button id="restart-btn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
