<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS <span class="smiley" role="img" aria-label="cara feliz">😊</span></h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa / menú</li>
          </ul>
        </div>

        <div class="panel-section">
          <span class="label">THEME</span>
          <button id="theme-toggle" class="theme-switch" role="switch" aria-checked="false">
            <span class="track"><span class="thumb"></span></span>
            <span id="theme-text">Modo claro</span>
          </button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div id="gameover-box" class="overlay-box" hidden>
        <p class="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn" class="menu-btn primary">Reiniciar</button>
      </div>

      <div id="pause-menu" class="overlay-box menu" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
        <p id="pause-title" class="overlay-title pause">PAUSA</p>
        <button id="resume-btn" class="menu-btn primary" data-menu-item>Reanudar</button>
        <button id="menu-restart-btn" class="menu-btn" data-menu-item>Reiniciar</button>
        <button id="controls-btn" class="menu-btn" aria-expanded="false" aria-controls="menu-controls" data-menu-item>Ver controles</button>
        <ul id="menu-controls" class="menu-controls" hidden></ul>

        <div class="level-picker">
          <span class="label" id="start-level-label">NIVEL INICIAL</span>
          <div class="stepper">
            <button id="level-down" class="step-btn" tabindex="-1" aria-label="Bajar nivel inicial">−</button>
            <span id="start-level" class="step-value" role="spinbutton" tabindex="0"
                  aria-labelledby="start-level-label" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"
                  data-menu-item>1</span>
            <button id="level-up" class="step-btn" tabindex="-1" aria-label="Subir nivel inicial">+</button>
          </div>
          <span class="hint">Se aplica en la próxima partida</span>
        </div>

        <p class="hint">↑↓ navegar · ←→ nivel · Enter elegir · Esc volver</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
